<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  
  <!--fontawesome cdn-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  
  <title>Personal Portfolio Website Using HTML & CSS</title>
</head>
<body>
  <nav class="navbar">
    <a href="#" class="logo">Portfolio</a>

    <ul>
      <li class="active"><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Portfolio</a></li>
      <li><a href="#">Service</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>


  <!--text animation-->
  <section class="home">
    <div class="home-info">
      <h1>Akhlakur Rahman</h1>
      <h2>I'm a <span class="auto-type"></span></h2>
      <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>

     <script>
        var typed = new Typed(".auto-type",{
          strings : ["Frontend Developer", "Designer"],
          typeSpeed : 150,
          backSpeed : 150,
          loop : true
        })
      </script>
      <p>I'm currently learning HTML & CSS and building my first portfolio. Next, I plan to learn JavaScript, Tailwind CSS, and React.js to make my projects more interactive and professional.</p>


      <!--social media links-->
      <div class="btn-sci">
        <a href="#" class="btn">Download CV</a>

        <div class="sci">
          <a href="#"><i class="fa-brands fa-github"></i></a>
          <a href="#"><i class="fa-brands fa-linkedin"></i></a>
          <a href="#"><i class="fa-brands fa-twitter"></i></a>
          <a href="#"><i class="fa-brands fa-youtube"></i></a>
        </div>
      
      </div>
    
    </div>
  
    <!--animation bar-->
     <div class="bar-animation">
        <div class="bar" style="--i:6;"></div>
        <div class="bar" style="--i:5;"></div>
        <div class="bar" style="--i:4;"></div>
        <div class="bar" style="--i:3;"></div>
        <div class="bar" style="--i:2;"></div>
        <div class="bar" style="--i:1;"></div>
     </div>


    <!--imag add-->
    <div class="home-img">
      <div class="img-box">
        <div class="img-item">
        <img src="f9e45036-2b4c-4822-9988-72c967be29c1.png" alt="">
        </div>
      </div>
    </div>
  </section>
</body>
</html>
